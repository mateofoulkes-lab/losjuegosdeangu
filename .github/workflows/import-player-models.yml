name: Import player GLB models

on:
  push:
    paths:
      - '.github/workflows/import-player-models.yml'

permissions:
  contents: write

jobs:
  import-models:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified GLB assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          curl -L --fail --retry 3 -o models/duck.glb \
            https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Duck/glTF-Binary/Duck.glb
          curl -L --fail --retry 3 -o models/car.glb \
            https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/ToyCar/glTF-Binary/ToyCar.glb
          curl -L --fail --retry 3 -o models/shoe.glb \
            https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/MaterialsVariantsShoe/glTF-Binary/MaterialsVariantsShoe.glb
          curl -L --fail --retry 3 -o models/dog.glb \
            https://raw.githubusercontent.com/ReactVision/expo-starter-kit-typescript/main/assets/models/dog.glb

          python3 - <<'PY'
          from pathlib import Path
          for path in Path('models').glob('*.glb'):
              data = path.read_bytes()
              if len(data) < 1024:
                  raise SystemExit(f'{path} is suspiciously small: {len(data)} bytes')
              if data[:4] != b'glTF':
                  raise SystemExit(f'{path} is not a valid binary glTF file')
              print(path, len(data), 'bytes OK')
          PY

      - name: Add provenance notes
        shell: bash
        run: |
          cat > models/SOURCES.md <<'EOF'
          # Player model sources

          - `duck.glb` — KhronosGroup/glTF-Sample-Assets, `Models/Duck/glTF-Binary/Duck.glb`.
          - `car.glb` — KhronosGroup/glTF-Sample-Assets, `Models/ToyCar/glTF-Binary/ToyCar.glb`.
          - `shoe.glb` — KhronosGroup/glTF-Sample-Assets, `Models/MaterialsVariantsShoe/glTF-Binary/MaterialsVariantsShoe.glb`.
          - `dog.glb` — ReactVision/expo-starter-kit-typescript, `assets/models/dog.glb`. The repository is MIT licensed; verify whether the model has separate upstream attribution before external redistribution.
          EOF

      - name: Commit imported assets and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/import-player-models.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models .github/workflows/import-player-models.yml
          git commit -m 'Add GLB player token models'
          git push origin HEAD:main
