<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Angu · Simulador 4 celulares</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:#07182b;color:#fff}
  body{padding:14px}
  .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:12px 14px;border:1px solid #ffffff22;background:#0d2947;border-radius:16px;position:sticky;top:0;z-index:5;box-shadow:0 8px 28px #0005}
  h1{font-size:18px;margin:0 auto 0 0}.hint{font-size:12px;opacity:.72}
  input{width:110px;padding:10px 12px;border-radius:10px;border:1px solid #ffffff2a;background:#061525;color:#fff;font-size:18px;font-weight:900;text-align:center;text-transform:uppercase;letter-spacing:.12em}
  button{padding:10px 15px;border:0;border-radius:10px;background:#ffc52f;color:#1b2030;font-weight:900;cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:14px}
  .phone{background:#05080c;border:8px solid #151b24;border-radius:28px;overflow:hidden;box-shadow:0 12px 34px #0007;min-height:520px;position:relative}
  .label{position:absolute;left:50%;top:5px;transform:translateX(-50%);z-index:2;background:#000a;border-radius:99px;padding:4px 11px;font-size:11px;font-weight:900;pointer-events:none}
  iframe{display:block;border:0;width:100%;height:520px;background:#0b3154}
  @media(max-width:800px){.grid{grid-template-columns:1fr}.phone,iframe{min-height:560px;height:560px}}
</style>
</head>
<body>
  <div class="top">
    <h1>🐾 Simulador de 4 celulares</h1>
    <span class="hint">Creá la sala en la otra ventana, copiá el código acá.</span>
    <input id="code" maxlength="4" placeholder="ABCD" autocomplete="off">
    <button id="connect">Conectar los 4</button>
  </div>
  <div class="grid" id="grid"></div>
<script>
const code=document.getElementById('code'),grid=document.getElementById('grid');
code.addEventListener('input',()=>code.value=code.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4));
function mount(){
  const c=code.value.trim(); if(c.length!==4){code.focus();return}
  grid.innerHTML='';
  for(let i=1;i<=4;i++){
    const wrap=document.createElement('div');wrap.className='phone';
    wrap.innerHTML=`<div class="label">CELULAR ${i}</div><iframe allow="autoplay; fullscreen" src="./simplayer.html?room=${encodeURIComponent(c)}&slot=${i}"></iframe>`;
    grid.appendChild(wrap);
  }
  history.replaceState(null,'',`?room=${c}`);
}
document.getElementById('connect').onclick=mount;
const incoming=new URLSearchParams(location.search).get('room');if(incoming){code.value=incoming.toUpperCase().slice(0,4);mount()}
</script>
</body>
</html>
