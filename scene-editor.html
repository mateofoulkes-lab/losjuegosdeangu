<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Los juegos de Angu · Editor de escena</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,sans-serif;background:#071a35;color:#fff}button,input,select{font:inherit}.app{display:grid;grid-template-columns:300px 1fr;height:100vh}.panel{background:#081d38;border-right:1px solid #ffffff1d;padding:14px;overflow:auto;z-index:10}.panel h1{font-size:18px;margin:0 0 4px}.panel .sub{font-size:12px;opacity:.62;margin-bottom:14px}.group{background:#0d2a4d;border:1px solid #ffffff17;border-radius:14px;padding:11px;margin-bottom:10px}.group h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#ffd451;margin:0 0 9px}.objects{display:grid;gap:6px}.obj{width:100%;text-align:left;padding:8px 10px;border:1px solid #ffffff1a;border-radius:9px;background:#12345e;color:#fff;cursor:pointer}.obj.active{border-color:#ffd451;background:#19477d}.row{display:grid;grid-template-columns:23px 1fr 1fr 1fr;gap:5px;align-items:center;margin:5px 0}.row label{font-size:11px;opacity:.65}.row input{width:100%;min-width:0;background:#07182e;border:1px solid #ffffff1c;color:#fff;border-radius:7px;padding:6px}.toolbar{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.toolbar button,.wide{background:#153d6c;color:white;border:1px solid #ffffff22;border-radius:9px;padding:8px;cursor:pointer}.toolbar button.on{background:#e4b526;color:#122441;font-weight:800}.wide{width:100%;margin-top:6px}.copy{background:#ffd451!important;color:#132746!important;font-weight:900!important}.status{font:11px ui-monospace,monospace;white-space:pre-wrap;opacity:.7;margin-top:8px}.viewport{position:relative;min-width:0}.viewport canvas{display:block;width:100%;height:100%}.hint{position:absolute;right:12px;top:12px;background:#071a35d9;border:1px solid #ffffff20;border-radius:11px;padding:9px 11px;font-size:11px;line-height:1.45;pointer-events:none}.badge{position:absolute;left:12px;bottom:12px;background:#071a35d9;border-radius:999px;padding:8px 12px;font:11px ui-monospace,monospace}.divider{height:1px;background:#ffffff15;margin:9px 0}.check{display:flex;gap:8px;align-items:center;font-size:12px;margin:6px 0}@media(max-width:850px){.app{grid-template-columns:230px 1fr}.panel{padding:9px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
<div class="app">
<aside class="panel">
  <h1>🐾 Editor de escena</h1>
  <div class="sub">Los juegos de Angu · v0.1</div>

  <div class="group">
    <h2>Objetos</h2>
    <div id="objects" class="objects"></div>
  </div>

  <div class="group">
    <h2>Herramienta</h2>
    <div class="toolbar"><button id="moveBtn" class="on">Mover W</button><button id="rotBtn">Rotar E</button><button id="scaleBtn">Escala R</button></div>
    <button id="focusBtn" class="wide">Enfocar seleccionado · F</button>
    <label class="check"><input id="localCheck" type="checkbox"> ejes locales</label>
  </div>

  <div class="group">
    <h2>Transform</h2>
    <div class="row"><label>P</label><input id="px" type="number" step="0.05"><input id="py" type="number" step="0.05"><input id="pz" type="number" step="0.05"></div>
    <div class="row"><label>R°</label><input id="rx" type="number" step="1"><input id="ry" type="number" step="1"><input id="rz" type="number" step="1"></div>
    <div class="row"><label>S</label><input id="sx" type="number" step="0.05"><input id="sy" type="number" step="0.05"><input id="sz" type="number" step="0.05"></div>
    <button id="resetBtn" class="wide">Reset seleccionado</button>
  </div>

  <div class="group">
    <h2>Cámara final</h2>
    <div class="row"><label>P</label><input id="cx" type="number" step="0.1"><input id="cy" type="number" step="0.1"><input id="cz" type="number" step="0.1"></div>
    <div class="row"><label>T</label><input id="tx" type="number" step="0.1"><input id="ty" type="number" step="0.1"><input id="tz" type="number" step="0.1"></div>
    <div class="row"><label>FOV</label><input id="fov" type="number" step="1"><span></span><span></span></div>
    <button id="cameraTopBtn" class="wide">Preset más cenital</button>
  </div>

  <div class="group">
    <h2>Salida</h2>
    <button id="copyBtn" class="wide copy">Copiar configuración</button>
    <button id="downloadBtn" class="wide">Mostrar texto</button>
    <div id="status" class="status">Cargando modelos…</div>
  </div>
</aside>
<main class="viewport" id="viewport">
  <div class="hint"><b>Mouse izq.</b> orbitar cámara<br><b>Rueda</b> zoom<br><b>Mouse der.</b> desplazar<br><b>W / E / R</b> mover · rotar · escala<br><b>F</b> enfocar objeto</div>
  <div class="badge">La cámara que dejás acá será la cámara final</div>
</main>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {TransformControls} from 'three/addons/controls/TransformControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const viewport=document.getElementById('viewport');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;renderer.shadowMap.enabled=true;viewport.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b3154);
const camera=new THREE.PerspectiveCamera(36,1,.05,300);camera.position.set(0,18,15);camera.lookAt(0,0,0);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.dampingFactor=.08;orbit.target.set(0,0,0);orbit.maxPolarAngle=Math.PI*.49;orbit.minDistance=2;orbit.maxDistance=80;
const transform=new TransformControls(camera,renderer.domElement);transform.setSize(.8);scene.add(transform.getHelper());transform.addEventListener('dragging-changed',e=>orbit.enabled=!e.value);
scene.add(new THREE.HemisphereLight(0xfff0ce,0x183757,2.7));const sun=new THREE.DirectionalLight(0xffdf9a,3.4);sun.position.set(-8,16,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const grid=new THREE.GridHelper(30,30,0x79b3dd,0x315d79);grid.position.y=-.005;grid.material.opacity=.16;grid.material.transparent=true;scene.add(grid);

const loader=new GLTFLoader(), texLoader=new THREE.TextureLoader();
const objects=new Map();let selected=null;
const defaults={
 TABLERO:{url:'./TABLERO.glb',p:[0,.22,0],r:[0,0,0],s:[7.2,7.2,7.2]},
 CUCHA:{url:'./CUCHA.glb',p:[-7.4,.05,-2.9],r:[0,-.35,0],s:[1.7,1.7,1.7]},
 PLATO:{url:'./PLATO.glb',p:[7.3,.05,-2.2],r:[0,.15,0],s:[1,1,1]},
 PELOTA:{url:'./PELOTA.glb',p:[6.6,.05,3.6],r:[0,0,0],s:[.75,.75,.75]},
 JUGUETE:{url:'./JUGUETE.glb',p:[-6.7,.05,3.8],r:[0,.35,0],s:[1,1,1]},
 PIN1:{url:'./pin.glb',p:[0,.45,-4.4],r:[0,0,0],s:[.42,.42,.42]},
 PIN2:{url:'./pin.glb',p:[.45,.45,-4.4],r:[0,0,0],s:[.42,.42,.42]},
 PIN3:{url:'./pin.glb',p:[.9,.45,-4.4],r:[0,0,0],s:[.42,.42,.42]},
 PIN4:{url:'./pin.glb',p:[1.35,.45,-4.4],r:[0,0,0],s:[.42,.42,.42]},
 PREMIO:{url:'./prize.glb',p:[3,.4,0],r:[0,0,0],s:[.5,.5,.5]}
};

function applyTransform(o,d){o.position.fromArray(d.p);o.rotation.set(...d.r);o.scale.fromArray(d.s)}
function addListButton(name){const b=document.createElement('button');b.className='obj';b.textContent=name;b.onclick=()=>selectObject(name);document.getElementById('objects').appendChild(b);return b}

// Mesa: un plano real con FONDO.jpg, independiente del GLB del tablero.
const tableTex=texLoader.load('./FONDO.jpg');tableTex.colorSpace=THREE.SRGBColorSpace;tableTex.wrapS=tableTex.wrapT=THREE.RepeatWrapping;tableTex.repeat.set(1.25,1);
const table=new THREE.Mesh(new THREE.PlaneGeometry(24,15),new THREE.MeshStandardMaterial({map:tableTex,roughness:.87,metalness:0}));table.rotation.x=-Math.PI/2;table.position.y=-.08;table.receiveShadow=true;table.userData.editorName='MESA';scene.add(table);objects.set('MESA',table);addListButton('MESA');

for(const [name,d] of Object.entries(defaults)){
 const btn=addListButton(name);btn.disabled=true;
 loader.load(d.url,g=>{
   const o=g.scene;o.userData.editorName=name;applyTransform(o,d);o.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true}});scene.add(o);objects.set(name,o);btn.disabled=false;document.getElementById('status').textContent=`Cargado: ${objects.size-1}/${Object.keys(defaults).length}`;
   if(name==='TABLERO')selectObject(name);
 },undefined,err=>{btn.textContent=name+' ⚠';btn.disabled=false;console.error(name,err)});
}

function selectObject(name){const o=objects.get(name);if(!o)return;selected=o;transform.attach(o);document.querySelectorAll('.obj').forEach(b=>b.classList.toggle('active',b.textContent.replace(' ⚠','')===name));syncInputs()}
function deg(r){return THREE.MathUtils.radToDeg(r)}function rad(d){return THREE.MathUtils.degToRad(Number(d)||0)}
const ids=['px','py','pz','rx','ry','rz','sx','sy','sz'];
function syncInputs(){if(!selected)return;const p=selected.position,r=selected.rotation,s=selected.scale;px.value=p.x.toFixed(3);py.value=p.y.toFixed(3);pz.value=p.z.toFixed(3);rx.value=deg(r.x).toFixed(1);ry.value=deg(r.y).toFixed(1);rz.value=deg(r.z).toFixed(1);sx.value=s.x.toFixed(3);sy.value=s.y.toFixed(3);sz.value=s.z.toFixed(3)}
function applyInputs(){if(!selected)return;selected.position.set(+px.value,+py.value,+pz.value);selected.rotation.set(rad(rx.value),rad(ry.value),rad(rz.value));selected.scale.set(+sx.value,+sy.value,+sz.value)}
ids.forEach(id=>document.getElementById(id).addEventListener('change',applyInputs));transform.addEventListener('objectChange',syncInputs);

function setMode(mode){transform.setMode(mode);moveBtn.classList.toggle('on',mode==='translate');rotBtn.classList.toggle('on',mode==='rotate');scaleBtn.classList.toggle('on',mode==='scale')}
moveBtn.onclick=()=>setMode('translate');rotBtn.onclick=()=>setMode('rotate');scaleBtn.onclick=()=>setMode('scale');localCheck.onchange=()=>transform.setSpace(localCheck.checked?'local':'world');
function focusSelected(){if(!selected)return;const box=new THREE.Box3().setFromObject(selected),center=new THREE.Vector3(),size=new THREE.Vector3();box.getCenter(center);box.getSize(size);orbit.target.copy(center);const d=Math.max(size.length()*1.4,2);const dir=camera.position.clone().sub(orbit.target).normalize();camera.position.copy(center).add(dir.multiplyScalar(d));orbit.update()}
focusBtn.onclick=focusSelected;
resetBtn.onclick=()=>{if(!selected)return;const n=selected.userData.editorName;if(n==='MESA'){selected.position.set(0,-.08,0);selected.rotation.set(-Math.PI/2,0,0);selected.scale.set(1,1,1)}else if(defaults[n])applyTransform(selected,defaults[n]);syncInputs()};

function syncCameraFields(){cx.value=camera.position.x.toFixed(3);cy.value=camera.position.y.toFixed(3);cz.value=camera.position.z.toFixed(3);tx.value=orbit.target.x.toFixed(3);ty.value=orbit.target.y.toFixed(3);tz.value=orbit.target.z.toFixed(3);fov.value=camera.fov.toFixed(1)}
orbit.addEventListener('change',syncCameraFields);syncCameraFields();
['cx','cy','cz','tx','ty','tz','fov'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{camera.position.set(+cx.value,+cy.value,+cz.value);orbit.target.set(+tx.value,+ty.value,+tz.value);camera.fov=+fov.value;camera.updateProjectionMatrix();orbit.update()}));
cameraTopBtn.onclick=()=>{camera.position.set(0,20,9.5);orbit.target.set(0,0,0);camera.fov=36;camera.updateProjectionMatrix();orbit.update();syncCameraFields()};

function vec(v){return [v.x,v.y,v.z].map(n=>+n.toFixed(4))}
function exportConfig(){
 const out={camera:{position:vec(camera.position),target:vec(orbit.target),fov:+camera.fov.toFixed(2)},objects:{}};
 for(const [name,o] of objects){out.objects[name]={position:vec(o.position),rotationDeg:[deg(o.rotation.x),deg(o.rotation.y),deg(o.rotation.z)].map(n=>+n.toFixed(3)),scale:vec(o.scale)}}
 return `LOS JUEGOS DE ANGU · SCENE CONFIG\n${JSON.stringify(out,null,2)}`;
}
copyBtn.onclick=async()=>{const t=exportConfig();try{await navigator.clipboard.writeText(t);status.textContent='✓ Configuración copiada. Pegámela en ChatGPT.'}catch{status.textContent=t}};
downloadBtn.onclick=()=>{status.textContent=exportConfig()};

document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.code==='KeyW')setMode('translate');if(e.code==='KeyE')setMode('rotate');if(e.code==='KeyR')setMode('scale');if(e.code==='KeyF')focusSelected()});

function resize(){const w=viewport.clientWidth,h=viewport.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
(function loop(){requestAnimationFrame(loop);orbit.update();renderer.render(scene,camera)})();
</script>
</body>
</html>
